<title>Menu bar counter</title>
<style>
  :root { --bg: #f5f4f1; --fg: #1d1f24; --accent: #2c4fc4; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17181b; --fg: #ecebe7; --accent: #8ea6f5; } }
  body { background: var(--bg); color: var(--fg); font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; padding: 24px; }
  button { font: inherit; padding: 6px 12px; }
</style>
<!-- Publish with capabilities: {desktop: {}}. List only the permissions the page uses. A permission that is not listed is refused without asking. -->
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["menu-bar"]}</script>

<h1>Menu bar counter</h1>
<p id="out">Starting</p>

<script type="module">
const out = document.getElementById("out");
const desktop = await window.claude?.use?.("desktop").catch(() => null);

function button(text, onclick) {
  const b = document.body.appendChild(document.createElement("button"));
  b.textContent = text;
  b.onclick = onclick;
  return b;
}

function appIcon() {
  // The app icon: a square canvas, drawn here so the app has its own icon (the PNG must stay under 256 KB, per the desktop API's type notes, runtime contract 0.2.99).
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const x = c.getContext("2d");
  x.fillStyle = "#2c4fc4";
  x.fillRect(0, 0, 256, 256);
  x.fillStyle = "#fff";
  x.beginPath();
  x.arc(128, 128, 72, 0, Math.PI * 2);
  x.fill();
  return c.toDataURL("image/png");
}

// A small template icon: black on transparent, so the menu bar paints it in its own color.
function trayIcon() {
  const c = document.createElement("canvas");
  c.width = c.height = 36;
  const x = c.getContext("2d");
  x.beginPath();
  x.arc(18, 18, 12, 0, Math.PI * 2);
  x.fill();
  return c.toDataURL("image/png");
}

if (!desktop?.tray) {
  // Outside the installed app: offer the install button, or say where it runs.
  if ((await desktop?.install?.state().catch(() => "unavailable")) === "available") {
    button("Install as app", () => desktop.install.request().catch(() => {}));
    out.textContent = "Install this page to run it as an app.";
  } else {
    out.textContent = "Open this artifact in the Claude desktop app and choose Install as app.";
  }
} else {
  desktop.app?.dock?.setIcon(appIcon()).catch(() => {});
  let n = 0;
  const show = async () => {
    try {
      // The menu bar item goes away when the page reloads, so set it on every load.
      await desktop.tray.set({
        icon: trayIcon(),
        title: String(n),
        menu: [{ label: "Add one", click: () => { n++; show(); } }],
      });
      out.textContent = "Count: " + n;
    } catch (e) {
      out.textContent = "Menu bar item refused: " + e.message;
    }
  };
  // A call that needs a permission is refused while the window is hidden (during install),
  // so start on load only when the permission is already granted.
  if ((await desktop.permissions.state("menu-bar")) === "granted") {
    show();
  } else {
    if ((await desktop.permissions.state("menu-bar")) === "denied") {
      // A denial stays denied for this page load, so point to the permissions panel instead of asking again.
      out.textContent = "The menu bar item is off for this app.";
      button("Manage permissions", () => desktop.permissions.manage().catch(() => {}));
    } else {
      out.textContent = "Allow the menu bar item to start.";
      button("Show in menu bar", show);
    }
  }
}
</script>
