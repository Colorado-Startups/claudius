<style>

  --text:#2B1D12; --dim:#5A4632; --accent:#F0A92B; --accent-deep:#D9921A; --on-accent:#2B1D12; --link:#A3400F;

  --good:#3E5A4A; --good-wash:#E3EEE6; --warn:#7A4B00; --warn-wash:#FBE9C2; --bad:#B42318; --bad-wash:#FBE1DC;

}

  --good:#8FD0A9; --good-wash:#1B3A2C; --warn:#F5C25B; --warn-wash:#3A2F10; --bad:#FF8A7A; --bad-wash:#4A2220;
  --run:#8DB8F0; --run-wash:#1D3558; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#101B33; --surface:#1B2A4B; --surface-2:#27396A; --rule:#34476F;
  --text:#FFFBF3; --dim:#E9DCC0; --link:#FFB85C; --night:#0A1226;
  --good:#8FD0A9; --good-wash:#1B3A2C; --warn:#F5C25B; --warn-wash:#3A2F10; --bad:#FF8A7A; --bad-wash:#4A2220;
  --run:#8DB8F0; --run-wash:#1D3558; color-scheme:dark}

<script type="application/json" id="claudius-config">{"repos":["Colorado-Startups/claudius"],"quality":["https://colorado-startups.github.io/claudius/"]}</script>

<div class="band">
  <div class="id">
    <img class="gnome" id="gnome" alt="Claudius, an AI agent character" width="44" height="44">
    <h1>Claudius</h1>
    <span class="meta" id="meta">Starting</span>
    <button class="ghost" id="refresh" hidden>Refresh now</button>
  </div>
  <nav id="nav" aria-label="Views"></nav>
</div>
<main id="app"></main>

<script type="module">
const CONFIG = JSON.parse(document.getElementById("claudius-config").textContent);   // the repos and Quality pages to start with
const DEFAULT_REPOS = CONFIG.repos, DEFAULT_QUALITY = CONFIG.quality;
const POLL_MS = 120000;       // two minutes: kind to the shared GitHub rate limit
const SLOW_EVERY = 5;         // repo readiness and quality scores change slowly: every fifth check
const IDLE_MIN = 15;          // an open PR with no update this long is flagged
const GOAL = 90, LOW = 70;    // a score at the goal is good, under LOW needs work
const REPO_RE = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
const URL_RE = /^https:\/\/[A-Za-z0-9.-]+(\/[A-Za-z0-9._~\/-]*)?$/;
const SHA_RE = /^[0-9a-f]{40}$/;
const VIEWS = [["today", "Today"], ["builds", "Builds"], ["quality", "Quality"], ["repos", "Repos"]];
const blob = (id) => document.getElementById(id)?.textContent.trim();
const app = document.getElementById("app");
const meta = document.getElementById("meta");
const refreshBtn = document.getElementById("refresh");
const nav = document.getElementById("nav");
document.getElementById("gnome").src = "data:image/png;base64," + blob("img-avatar");

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v; else el.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) el.append(kid);
  return el;
}

// ---- pure logic -----------------------------------------------------------
function rollup(runs) {
  if (!runs.length) return "none";
  const bad = new Set(["failure", "timed_out", "cancelled", "action_required", "startup_failure"]);
  if (runs.some((r) => r.status === "completed" && bad.has(r.conclusion))) return "fail";
  if (runs.some((r) => r.status !== "completed")) return "running";
  return "pass";
}
function label(pr) {           // one state per PR, worst news first
  if (pr.checks === "fail") return { text: "Failing", kind: "bad" };
  if (pr.checks === "running") return { text: "Running", kind: "run" };
  if (pr.draft) return { text: pr.checks === "pass" ? "Draft, green" : "Draft", kind: "mut" };
  if (pr.checks === "pass") return { text: "Ready", kind: "ok" };
  return { text: "No checks", kind: "mut" };
}
function idleMinutes(updatedAt, now = Date.now()) { return Math.max(0, Math.round((now - Date.parse(updatedAt)) / 60000)); }
function isIdle(p) { return ["Running", "No checks", "Draft"].includes(label(p).text) && idleMinutes(p.updated) >= IDLE_MIN; }
function ago(m) { return m < 60 ? m + "m" : m < 1440 ? Math.round(m / 60) + "h" : Math.round(m / 1440) + "d"; }
function band(v) { return v >= GOAL ? "ok" : v >= LOW ? "warn" : "bad"; }
function changes(prev, now) {    // notifications worth sending
  const out = [];
  for (const [key, p] of Object.entries(now)) {
    const before = prev[key];
    if (!before) continue;
    const s = label(p).text, was = label(before).text;
    if (s === was) continue;
    if (s === "Ready") out.push(`${key} is ready for review`);
    else if (s === "Failing") out.push(`${key} has failing checks`);
  }
  for (const key of Object.keys(prev)) if (!now[key]) out.push(`${key} was merged or closed`);
  return out;
}
const CHECKS = [   // what a repo needs before agents can build in it, each read from GitHub
  ["AGENTS.md", (r) => r.files.includes("AGENTS.md")],
  ["CLAUDE.md", (r) => r.files.includes("CLAUDE.md")],
  ["README", (r) => r.files.some((f) => /^README/i.test(f))],
  ["SECURITY.md", (r) => r.files.includes("SECURITY.md") || r.dotgithub.includes("SECURITY.md")],
  ["CI workflow", (r) => r.workflows.length > 0],
  ["Rules on main", (r) => r.rules === null ? null : r.rules > 0],
  ["Squash only", (r) => r.squash && !r.merge && !r.rebase],
  ["Deletes merged branches", (r) => r.delbr],
];
function readiness(r) {
  const rows = CHECKS.map(([name, f]) => ({ name, ok: f(r) }));
  const read = rows.filter((x) => x.ok !== null);
  return { rows, pass: read.filter((x) => x.ok).length, of: read.length };
}
function parseQuality(out) {   // the lines `grep -o` keeps from a Quality page: totals first, then each tab
  const totals = {}, tabs = []; let cur = null, m;
  const text = (s) => new DOMParser().parseFromString(s, "text/html").documentElement.textContent;
  for (const line of out.split("\n")) {
    if ((m = line.match(/^<section id="([a-z0-9-]+)"/))) { cur = { id: m[1], name: m[1], scores: {} }; tabs.push(cur); }
    else if ((m = line.match(/^<\/svg>(.+)<\/h2>$/)) && cur) cur.name = text(m[1]);
    else if ((m = line.match(/^aria-valuenow="(\d+)" aria-label="(.+)"$/))) {
      const v = +m[1], l = m[2];
      if (!cur) { if (l === "Master score") totals.master = v; else if ((m = l.match(/^Overall (quality|speed|consumption)$/))) totals[m[1]] = v; }
      else if (["Quality", "Speed", "Consumption"].includes(l)) cur.scores[l.toLowerCase()] = v;
    }
  }
  return { totals, tabs: tabs.filter((t) => Object.keys(t.scores).length) };
}
function needs(all, ready, quals) {   // what to look at first, worst news first
  const out = [];
  for (const p of all) {
    const l = label(p);
    if (l.text === "Failing") out.push({ rank: 0, kind: "bad", tag: "CI failing", title: p.title, sub: `${p.key} on ${p.branch}`, url: p.url });
    else if (l.text === "Ready") out.push({ rank: 2, kind: "ok", tag: "Green, needs review", title: p.title, sub: `${p.key} on ${p.branch}`, url: p.url });
    else if (isIdle(p)) out.push({ rank: 1, kind: "warn", tag: "Quiet " + ago(idleMinutes(p.updated)), title: p.title, sub: `${p.key} on ${p.branch}`, url: p.url });
  }
  for (const [repo, r] of Object.entries(ready)) {
    const s = readiness(r), gaps = s.rows.filter((x) => x.ok === false).map((x) => x.name);
    if (gaps.length) out.push({ rank: 1, kind: "warn", tag: `${s.pass} of ${s.of} ready`, title: repo, sub: "Missing: " + gaps.join(", "), url: `https://github.com/${repo}` });
  }
  for (const q of quals) for (const t of q.tabs) {
    const worst = Object.entries(t.scores).sort((a, b) => a[1] - b[1])[0];
    if (worst && worst[1] < LOW) out.push({ rank: 0, kind: "bad", tag: `${worst[0][0].toUpperCase()}${worst[0].slice(1)} ${worst[1]}`, title: `${t.name} tab`, sub: `Under ${LOW} on the Quality page`, url: q.url });
  }
  return out.sort((a, b) => a.rank - b.rank).slice(0, 12);
}

// ---- reading through the desktop app ----------------------------------------
const q = (s) => "'" + s.replace(/'/g, "'\\''") + "'";
async function sh(desktop, cmd) {
  // A plain shell with Homebrew on PATH: a login shell can print profile output that breaks the result.
  const r = await desktop.childProcess.exec("/bin/zsh -c " + q("set -o pipefail; PATH=/opt/homebrew/bin:/usr/local/bin:$PATH " + cmd), { timeout: 40000 });
  if (r.code !== 0) {
    const text = (r.stderr || "command failed").trim(), err = new Error(text.split("\n").pop());
    err.full = text;   // the whole message, for matching; the last line is what shows
    throw err;
  }
  if (r.truncated) throw new Error("output was cut off");
  return r.stdout;
}
class SetupError extends Error {}   // gh is missing or signed out: one plain line, not one error per read
async function gh(desktop, args, jq) {
  let out;
  try { out = await sh(desktop, "gh " + args + " --jq " + q(jq)); }
  catch (e) {
    const full = e.full || e.message;
    if (/command not found: gh|gh: not found/.test(full)) throw new SetupError("The gh tool is not installed. Install it from cli.github.com, then choose Refresh.");
    if (/gh auth login|GH_TOKEN|not logged in/i.test(full)) throw new SetupError("gh is signed out. Run gh auth login in Terminal, then choose Refresh.");
    throw e;
  }
  try { return JSON.parse(out); } catch { throw new Error("gh did not return JSON"); }
}
async function readPRs(desktop, repo) {
  const prs = await gh(desktop, `api -X GET repos/${repo}/pulls -f state=open -f per_page=50`,
    "[.[]|{number,title,html_url,draft,updated_at,ref:.head.ref,sha:.head.sha}]");
  const out = [];
  for (const p of prs) {            // one command at a time: the app may hold 32 processes at most
    let checks = "none";
    if (SHA_RE.test(p.sha)) {
      const runs = await gh(desktop, `api -X GET repos/${repo}/commits/${p.sha}/check-runs -f per_page=100`, "[.check_runs[]|{status,conclusion}]");
      checks = rollup(runs);
    }
    out.push({ key: `${repo}#${p.number}`, repo, number: p.number, title: p.title, url: p.html_url,
      branch: p.ref, draft: !!p.draft, updated: p.updated_at, checks });
  }
  return out;
}
async function readRepo(desktop, repo) {
  const base = await gh(desktop, `api repos/${repo}`, "{squash:.allow_squash_merge,merge:.allow_merge_commit,rebase:.allow_rebase_merge,delbr:.delete_branch_on_merge}");
  const files = await gh(desktop, `api repos/${repo}/contents`, "[.[].name]");
  const workflows = await gh(desktop, `api repos/${repo}/contents/.github/workflows`, "[.[].name]").catch(() => []);
  const dotgithub = await gh(desktop, `api repos/${repo}/contents/.github`, "[.[].name]").catch(() => []);
  const rules = await gh(desktop, `api repos/${repo}/rules/branches/main`, "length").catch(() => null);   // rules that apply to main; null: not readable with this login
  return { ...base, files, workflows, dotgithub, rules };
}
async function readQuality(desktop, url) {
  const pat = '<section id="[a-z0-9-]+" class="view tab"|</svg>[^<]{1,60}</h2>|aria-valuenow="[0-9]+" aria-label="[A-Za-z ]+"';
  const out = await sh(desktop, `curl -fsS -m 30 ${q(url)} | grep -oE ${q(pat)}`);
  const parsed = parseQuality(out);
  if (parsed.totals.master === undefined) throw new Error("no scores found on " + url);
  return { url, ...parsed };
}

// ---- views ----------------------------------------------------------------
const S = { data: [], errors: [], ready: {}, quals: [], at: null, repos: DEFAULT_REPOS, view: "today" };

function scoreRow(name, v, cls = "") {
  const meter = h("span", { class: "meter " + band(v), role: "meter", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(v), "aria-label": name }, h("i", { style: `width:${v}%` }));
  return h("div", { class: "score " + cls }, h("span", { text: name }), meter, h("b", { text: String(v) }));
}
function prRow(p) {
  const l = label(p), m = idleMinutes(p.updated);
  const kind = l.kind === "mut" ? "" : l.kind;
  return h("div", { class: "row " + (isIdle(p) ? "warn" : kind) },
    h("span", { class: "pill " + kind, text: l.text }),
    h("span", { class: "t" }, h("span", { class: "num", text: "#" + p.number + " " }), h("a", { href: p.url, target: "_blank", rel: "noopener", text: p.title })),
    h("span", { class: "pill " + (isIdle(p) ? "warn" : ""), text: ago(m) }),
    h("span", { class: "sub", text: p.branch }));
}
function errors() { return S.errors.map((e) => h("div", { class: "err", role: "alert", text: e })); }
function qualityCard(qs) {
  if (!qs.length) return h("section", { class: "card" }, h("h2", { text: "Quality" }), h("p", { class: "empty", text: "No Quality page read yet. Add one under Settings." }));
  return h("section", { class: "card" }, h("h2", { text: "Quality" }), ...qs.map((x) => h("div", {},
    scoreRow("Master score", x.totals.master, "master"),
    ...["quality", "speed", "consumption"].filter((k) => x.totals[k] !== undefined).map((k) => scoreRow(k[0].toUpperCase() + k.slice(1), x.totals[k])),
    h("p", { class: "note" }, h("a", { href: x.url, target: "_blank", rel: "noopener", text: "Open the live page" })))));
}
function viewToday() {
  const all = S.data.flat(), n = (f) => all.filter(f).length;
  const list = needs(all, S.ready, S.quals), rows = list.length ? list.map((x) =>
    h("div", { class: "row " + x.kind }, h("span", { class: "pill " + x.kind, text: x.tag }), h("span", { class: "t" }, h("a", { href: x.url, target: "_blank", rel: "noopener", text: x.title })), h("span"), h("span", { class: "sub", text: x.sub })))
    : [h("div", { class: "empty", text: !S.at ? "Checking GitHub." : S.errors.length ? "Could not read everything. See the errors above." : "Nothing needs you. Claudius will say when that changes." })];
  const counts = h("ul", { class: "counts", "aria-label": "Open pull requests" },
    ...[["Open", all.length], ["Running", n((p) => p.checks === "running")], ["Ready", n((p) => label(p).text === "Ready")], ["Failing", n((p) => p.checks === "fail")]]
      .map(([k, v]) => h("li", {}, h("b", { text: String(v) }), k)));
  return h("div", { class: "cols" },
    h("section", {}, h("h2", { text: "Needs a look" }), h("div", { class: "card list", style: "padding:4px 0" }, ...rows)),
    h("div", { class: "stack" }, h("section", { class: "card" }, h("h2", { text: "Pull requests" }), counts), qualityCard(S.quals)));
}
function viewBuilds() {
  const parts = [];
  S.repos.forEach((repo, i) => {
    const rows = (S.data[i] || []).slice().sort((a, b) => b.updated.localeCompare(a.updated));
    parts.push(h("section", {}, h("div", { class: "repohead" }, h("h2", { text: repo }), h("span", { class: "note", text: rows.length + " open" })),
      h("div", { class: "card list", style: "padding:4px 0" }, ...(rows.length ? rows.map(prRow) : [h("div", { class: "empty", text: "No open pull requests." })]))));
  });
  return h("div", { class: "stack" }, ...parts);
}
function viewQuality() {
  if (!S.quals.length) return qualityCard([]);

      h("tbody", {}, ...tabs.map((t) => h("tr", {}, h("th", { scope: "row", text: t.name }), cell(t.scores.quality), cell(t.scores.speed), cell(t.scores.consumption)))));

function viewRepos() {

    if (!r) return h("section", { class: "card" }, h("h2", { text: repo }), h("p", { class: "empty", text: "Not read yet." }));

      h("div", { class: "chips" }, ...s.rows.map((x) => h("span", { class: "chip " + (x.ok === null ? "mut" : x.ok ? "ok" : "bad"), text: (x.ok === null ? "Not read: " : x.ok ? "Has " : "Missing ") + x.name }))));

}
function settings() {
  const ta = h("textarea", { id: "repos", "aria-label": "Repositories to watch" }); ta.value = store.get("repos", DEFAULT_REPOS).join("\n");
  const tq = h("textarea", { id: "quality-urls", "aria-label": "Quality pages to read" }); tq.value = store.get("quality", DEFAULT_QUALITY).join("\n");
  const save = h("button", { class: "save", id: "save", text: "Save and refresh" });

    h("h3", { text: "Repositories" }), ta, h("h3", { text: "Quality pages (https)" }), tq,

function foot() {
  return h("p", { class: "foot", text: "Claudius is an AI agent. This view reads GitHub through your gh login and the public Quality pages. Project threads, plan limits and credit use are not read yet." });
}
function render() {
  if (S.waiting) return;   // the permission card is showing
  const view = { today: viewToday, builds: viewBuilds, quality: viewQuality, repos: viewRepos }[S.view]();
  nav.replaceChildren(...VIEWS.map(([id, name]) => {
    const b = h("button", { text: name, type: "button" });

}
window.addEventListener("hashchange", route);

function installView(state) {

  nav.hidden = true;
  const card = h("section", { class: "card install" }, h("h2", { text: "Claudius runs as a Mac app" }),
    h("p", { text: "It watches your pull requests, builds, Quality scores and repo readiness with your own GitHub login (gh), and tells you when something needs a look. It needs its own window, so install it from the Claude desktop app." }));
  if (state === "available") {

    card.append(h("p", {}, b), h("p", { class: "note", text: "On install, Claude asks for full access, notifications and a menu bar item. All three are used. Claudius only reads: pull requests, checks, repo settings and public pages." }));

const desktop = await window.claude?.use?.("desktop").catch(() => null);

} else {

  desktop.window.setOptions({ titleBarStyle: "hiddenInset", dragHeight: 36, width: 860, height: 680 }).catch(() => {});
  refreshBtn.hidden = false;
  let prev = null, prevMaster = null;   // in memory only: the first check after a start never notifies
  let timer = null, busy = false, again = false, againSlow = false, gen = 0, tick = 0;

  async function setBar(all, failing, qs) {
    const title = failing ? `PR ${all.length} ✕${failing}` : `PR ${all.length}`;
    const items = needs(all, {}, []).slice(0, 10).map((x) => ({ label: `${x.tag}: ${x.title}`.slice(0, 80), href: x.url }));
    const link = qs[0] ? [{ label: "Open the Quality page", href: qs[0].url }] : [];
    await desktop.tray.set({ icon: "data:image/png;base64," + blob("img-tray"), iconIsTemplate: false, title, toolTip: "Claudius", menu: [
      ...items, ...(items.length ? [{ type: "separator" }] : []), ...link,
      { label: "Open Claudius", click: () => desktop.window.show().catch(() => {}) },
      { label: "Refresh now", click: () => window.__refresh(true) }] }).catch(() => {});

      const urls = store.get("quality", DEFAULT_QUALITY).filter((u) => URL_RE.test(u));
      meta.textContent = "Checking";
      const errs = [], data = [];
      let setup = false;   // gh missing or signed out: say it once and skip the rest
      for (const repo of repos) {
        if (setup) { data.push([]); continue; }
        try { data.push(await readPRs(desktop, repo)); }
        catch (e) { if (e instanceof SetupError) { setup = true; errs.push(e.message); } else errs.push(`${repo}: ${e.message}`); data.push([]); }
      }
      const buildsOk = !errs.length;
      let ready = S.ready, quals = S.quals;
      if (doSlow) {
        ready = {}; quals = [];
        if (!setup) for (const repo of repos) { try { ready[repo] = await readRepo(desktop, repo); } catch (e) { errs.push(`${repo} settings: ${e.message}`); } }
        for (const u of urls) { try { quals.push(await readQuality(desktop, u)); } catch (e) { errs.push(`${u}: ${e.message}`); } }
      }
      Object.assign(S, { data, errors: errs, ready, quals, repos, at: new Date() });
      render();
      const all = data.flat();
      const now = Object.fromEntries(all.map((p) => [p.key, p]));
      if (buildsOk && myGen === gen) {
        const msgs = prev ? changes(prev, now) : [];
        const master = quals[0]?.totals.master;
        if (prevMaster !== null && master !== undefined && master !== prevMaster) msgs.push(`Quality master score ${master > prevMaster ? "rose" : "fell"} from ${prevMaster} to ${master}`);
        if (master !== undefined) prevMaster = master;
        if (msgs.length) desktop.notification.show({ body: msgs.join(". ").slice(0, 280) }).catch(() => {});
        prev = now;
      }
      await setBar(all, all.filter((p) => p.checks === "fail").length, quals);
      meta.textContent = `Watching ${repos.length} ${repos.length === 1 ? "repo" : "repos"}, checked ` + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + (errs.length ? ", with errors" : "");
    } catch (e) {
      meta.textContent = "Check failed: " + e.message;
    } finally {
      busy = false;

    }
  };
  window.__reset = () => { prev = null; prevMaster = null; gen++; };
  refreshBtn.onclick = () => window.__refresh(true);
  route();

  // so ask from a click when any is still undecided, and otherwise start.
  const NEED = ["full-access", "notifications", "menu-bar"];
  async function offerManage() {
    const states = await desktop.permissions.state().catch(() => ({}));
    if (NEED.some((n) => states[n] === "denied") && !document.getElementById("manage")) {

    meta.textContent = "Waiting for permission";
    const go = h("button", { class: "primary", text: "Allow and start" });
    go.onclick = async () => {
      await desktop.permissions.request().catch(() => {});
