# Keyless Claude in GitHub Actions: a copy-and-fill workflow. Recipe: templates/claude/guides/detail/claude-api-ci.md.
# The three <...> values are identifiers, not secrets. The Console's Workload identity page shows them.
# Do not add an API key secret: a static key wins over federation and defeats the point.
name: claude-keyless

on:
  pull_request:
    types: [opened, synchronize]

# No token by default; the job asks for what it needs.
permissions: {}

concurrency:
  group: claude-keyless-${{ github.ref }}
  cancel-in-progress: true # a newer push replaces the older run

jobs:
  claude:
    # A fork's pull request gets no OIDC token, so skip it.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a stuck job stops here
    permissions:
      contents: read
      pull-requests: write # lets the action comment on the pull request
      id-token: write # lets the job ask GitHub for a signed token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          anthropic_federation_rule_id: <fdrl_ id>
          anthropic_organization_id: <organization id>
          anthropic_service_account_id: <svac_ id>
          prompt: Review this pull request for bugs and unclear text. Comment only on what you find.
          claude_args: --max-turns 8 # a turn cap keeps one run small
