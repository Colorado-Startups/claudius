name: release

# A release with no person in the loop. Bump `VERSION` in a pull request; when it merges to main, this workflow tags
# that commit `v<VERSION>` and publishes a GitHub release with generated notes. It needs no key beyond the workflow
# token, and it does nothing when the tag already exists, so a rerun is safe. A person can also run it by hand.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          v=$(tr -d '[:space:]' < VERSION)
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "VERSION must look like 1.2.3, got: $v"; exit 1 ;;
          esac
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Claudius $v" --generate-notes
