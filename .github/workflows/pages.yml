name: pages

# Claudius's public Process page and Quality page, built by Git Crafter's actions/pages at a full commit SHA
# (Git Crafter templates/ci/pages.yml). A pull request builds them and runs the privacy gate; only a push to main
# publishes. The build runs in CI mode from quality/public/, which drops every metric that needs local files and
# every map step one scores, so the pages hold no reading from a maintainer's machine; tests/privacy.mjs checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A deploy always finishes; a newer push queues behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The metrics marked needs gh read this repo's pull requests, checks, issues and Pages deployments with the
    # workflow token; a read refused is not measured.
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
      issues: read
      pull-requests: read
      # Dependabot's open alerts, read live (Git Crafter templates/ci/pages.yml); without it the read is a 403.
      vulnerability-alerts: read
    steps:
      # GitHub masks a secret's whole value, not each name in it, so each name is masked on its own before any
      # step can print one. A fork's pull request gets no secrets: nothing to mask.
      - name: Mask the privacy names
        env:
          PRIVACY_NAMES: ${{ secrets.PRIVACY_NAMES }}
        run: |
          IFS=, read -ra names <<< "$PRIVACY_NAMES"
          for n in "${names[@]}"; do
            # Trim as the gate does, so "a, b" masks "b" and not " b".
            n="${n#"${n%%[![:space:]]*}"}"; n="${n%"${n##*[![:space:]]}"}"
            if [ -n "$n" ]; then echo "::add-mask::$n"; fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # quality/config.json with each metric that needs local files dropped: not shown, not counted, not run. And
      # quality/process/config.json with the pack's maps in full and each step such a metric scores left out.
      - name: Public config
        run: node quality/public.mjs

      - uses: SoulCraft-Org/git-crafter/actions/pages@8023bd4683416f6d420bd20d137960b09c06b91e # v7.0.2
        with:
          pages: process quality
          config: quality/public/process.json
          quality-config: quality/public/config.json

      # The run the pages are drawn from: CI mode, no metric that needs local files, no home path, email or name
      # in the PRIVACY_NAMES secret. Every file the deploy uploads, quality/public/dist, gets the same checks but
      # the mode. A finding prints its file and line, never what it matched; no secret skips the name check.
      - name: Privacy gate
        env:
          PRIVACY_NAMES: ${{ secrets.PRIVACY_NAMES }}
        run: node tests/privacy.mjs quality/public/data/latest.json quality/public/targets --dist quality/public/dist

      # Each metric the run could not read, with its reason cut to 160 characters, one line each, so a maintainer sees
      # why a count such as 47 of 64 is short without the data artifact. It runs after the privacy gate, which has
      # checked the file it reads, and it never fails the build.
      - name: Unread metrics
        run: |
          node -e '
            const run = JSON.parse(require("fs").readFileSync("quality/public/data/latest.json", "utf8"));
            const unread = Object.entries(run.metrics).filter(([, m]) => m.could_not_check);
            console.log(`${unread.length} of ${Object.keys(run.metrics).length} metrics unread`);
            for (const [id, m] of unread) console.log(`  ${id}: ${String(m.could_not_check).replace(/\s+/g, " ").slice(0, 160)}`);
          ' || true

      # The master score and the metrics short of their goal, ranked by the points each adds (quality/score-log.mjs),
      # so a cloud thread, which cannot reach the deployed page, reads where the score stands from this log. It reads
      # the run the privacy gate has checked, runs from the pages action's own checkout of Git Crafter, and never
      # fails the build.
      - name: Score
        run: |
          engine=$(ls -d "$(dirname "$RUNNER_WORKSPACE")"/_actions/SoulCraft-Org/git-crafter/*/ 2>/dev/null | head -1)
          node quality/score-log.mjs "${engine%/}" --config quality/public/config.json || true

      # The scored run, for the issue-sync job below. Main only, like the deploy.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: quality-run
          path: quality/public/data/latest.json
          retention-days: 1

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: quality/public/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # issue-sync: Git Crafter's quality/sync-issues.mjs keeps one issue per metric that misses its goal
  # (quality/config.json issue_sync), so a miss is recorded as work to do and closes when the metric meets its
  # goal (Git Crafter templates/projects/tracking.md). It reads the run the build job scored, so it adds no
  # collection. Main only, with the one write grant it needs. A metric the run could not read is left alone.
  issue-sync:
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SoulCraft-Org/git-crafter
          ref: 8023bd4683416f6d420bd20d137960b09c06b91e # v7.0.2
          path: .git-crafter
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: .git-crafter/package-lock.json

      - name: Install the engine's packages
        run: npm ci --prefix .git-crafter --ignore-scripts --no-audit --no-fund --loglevel=error

      - name: Public config
        run: node quality/public.mjs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-run
          path: quality/public/data

      - name: Sync missed metrics to issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .git-crafter/quality/sync-issues.mjs --config quality/public/config.json
