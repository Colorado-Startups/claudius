name: pages

# Claudius's public Process page and Quality page, built by Git Crafter's actions/pages at a full commit SHA
# (Git Crafter templates/ci/pages.yml). A pull request builds them and runs the privacy gate; only a push to main
# publishes. The build runs in CI mode from quality/public/, which drops every metric that needs local files and
# every map step one scores, so the pages hold no reading from a maintainer's machine; tests/privacy.mjs checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A deploy always finishes; a newer push queues behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The quality-read environment holds QUALITY_APP_KEY, and its branch policy admits main alone: a pull request
    # run, even one that edits this file, cannot load it. Other runs use no environment.
    environment: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'quality-read' || '' }}
    # The metrics marked needs gh read this repo's pull requests, checks, issues and Pages deployments with the
    # workflow token; a read refused is not measured.
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
      issues: read
      pull-requests: read
      # Dependabot's open alerts, read live (Git Crafter templates/ci/pages.yml); without it the read is a 403.
      vulnerability-alerts: read
    steps:
      # GitHub masks a secret's whole value, not each name in it, so each name is masked on its own before any
      # step can print one. A fork's pull request gets no secrets: nothing to mask.
      - name: Mask the privacy names
        env:
          PRIVACY_NAMES: ${{ secrets.PRIVACY_NAMES }}
        run: |
          IFS=, read -ra names <<< "$PRIVACY_NAMES"
          for n in "${names[@]}"; do
            # Trim as the gate does, so "a, b" masks "b" and not " b".
            n="${n#"${n%%[![:space:]]*}"}"; n="${n%"${n##*[![:space:]]}"}"
            if [ -n "$n" ]; then echo "::add-mask::$n"; fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # quality/config.json with each metric that needs local files dropped: not shown, not counted, not run. And
      # quality/process/config.json with the pack's maps in full and each step such a metric scores left out.
      - name: Public config
        run: node quality/public.mjs

      # The claudius-quality-reader App's one-hour token, read-only and installed on this repo alone, for the metrics
      # marked needs github-admin (settings, scanning and alert state). Main only: a pull request builds without it,
      # and those metrics read not measured there. Its key went from the App's manifest conversion straight into the
      # quality-read environment secret (Git Crafter guard route key-issuer-to-store); no one holds it.
      - id: admin-app
        if: github.ref == 'refs/heads/main' && vars.QUALITY_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.QUALITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.QUALITY_APP_KEY }}
          repositories: claudius
          permission-administration: read
          permission-secret-scanning-alerts: read
          permission-security-events: read
          permission-vulnerability-alerts: read
          permission-organization-administration: read
          permission-members: read

      - uses: SoulCraft-Org/git-crafter/actions/pages@689a2c2d72b0ac2a9d5fd66131b9279e889b6c2a # v7.0.1
        with:
          pages: process quality
          config: quality/public/process.json
          quality-config: quality/public/config.json
          admin-read-token: ${{ github.ref == 'refs/heads/main' && steps.admin-app.outputs.token || '' }}

      # The run the pages are drawn from: CI mode, no metric that needs local files, no home path, email or name
      # in the PRIVACY_NAMES secret. Every file the deploy uploads, quality/public/dist, gets the same checks but
      # the mode. A finding prints its file and line, never what it matched; no secret skips the name check.
      - name: Privacy gate
        env:
          PRIVACY_NAMES: ${{ secrets.PRIVACY_NAMES }}
        run: node tests/privacy.mjs quality/public/data/latest.json quality/public/targets --dist quality/public/dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: quality/public/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
