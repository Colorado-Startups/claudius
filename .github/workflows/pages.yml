name: pages

# Claudius's public Quality page, built by Git Crafter's actions/pages at a full commit SHA (Git Crafter
# templates/ci/pages.yml). A pull request builds it and runs the privacy gate; only a push to main publishes.
# The build runs in CI mode from quality/public/config.json, which drops every metric that needs local files,
# so it holds no reading from a maintainer's machine; tests/privacy.mjs checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A deploy always finishes; a newer push queues behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The metrics marked needs gh read this repo's pull requests, checks, issues and Pages deployments with the
    # workflow token; a read refused is not measured.
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # quality/config.json with each metric that needs local files dropped: not shown, not counted, not run.
      - name: Public config
        run: node quality/public.mjs

      - uses: SoulCraft-Org/git-crafter/actions/pages@dd999dcac64873f77165609f3cc9fde4da49d332 # v6.0.0
        with:
          pages: quality
          quality-config: quality/public/config.json

      # The run the page is drawn from: CI mode, no metric that needs local files, no home path or email. CI sets
      # no account names. Every file the deploy uploads, quality/public/dist, gets the same checks but the mode.
      - name: Privacy gate
        run: node tests/privacy.mjs quality/public/data/latest.json targets --dist quality/public/dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: quality/public/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
