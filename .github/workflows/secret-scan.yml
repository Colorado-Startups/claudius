# Secrets anywhere in this repository's history: the shared gitleaks job (SoulCraft-Org/.github/.github/workflows/
# gitleaks.yml, pinned to a full commit SHA). The workflow is named secret-scan so the security.latest_scan_minutes
# metric finds it: its params.security_workflows matches "secret", and not "gitleaks". A false positive goes in
# .gitleaksignore, one finding fingerprint per line.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels its older scan. A scan running on main is never cancelled, and a queued one is replaced by the newer push, whose scan reads the whole history.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    uses: SoulCraft-Org/.github/.github/workflows/gitleaks.yml@ef092daa91e6a1d6449baaf8678f5a8b5c8a3f6f # main
